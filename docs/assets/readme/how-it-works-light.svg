<text x="38" y="200" font-family="'JetBrains Mono', SFMono-Regular, Consolas, Menlo, monospace" font-size="11" font-weight="600" fill="#5F6875" text-anchor="start">you</text>
<text x="90" y="200" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111827" text-anchor="start">Yes, slower please.</text>
<text x="38" y="228" font-family="'JetBrains Mono', SFMono-Regular, Consolas, Menlo, monospace" font-size="11" font-weight="600" fill="#5F6875" text-anchor="start">tutor</text>
<text x="90" y="228" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111827" text-anchor="start">Sure. Picture making</text>
