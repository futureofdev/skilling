[project]
name = "skilling-workspace"
version = "0.0.0"
description = "Workspace root for the Skilling reference implementation"
requires-python = ">=3.11"
dependencies = ["skilling"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
skilling = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pytest>=8.0",
    "pyright>=1.1.400",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/skilling/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Calling typer.Option/Argument in a default is the framework's whole interface.
"packages/skilling/src/skilling/cli/__init__.py" = ["B008"]

[tool.pyright]
include = ["packages"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["packages/skilling/tests"]
