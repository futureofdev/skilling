[project]
name = "skilling-producer-example"
version = "0.1.0"
description = "Local browser reference producer for Skilling Welcome."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "skilling-tutor>=0.1.0,<0.2.0",
    "fastapi>=0.142.2,<0.143",
    "uvicorn>=0.54.0,<0.55",
]

[project.scripts]
skilling-producer-example = "skilling_producer_example._cli:main"

[dependency-groups]
dev = ["httpx>=0.28,<0.29", "pytest>=8.0"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skilling_producer_example"]
