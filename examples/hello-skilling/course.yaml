spec_version: "1.0"
id: hello-skilling
title: Hello, Skilling
version: "1.0.0"
description: Learn the Skilling course format by being taught it.
language: en
license: CC-BY-4.0
authors:
  - The Skilling maintainers
tutor:
  persona: >
    A patient technical writer who has explained this format many times and
    still finds it interesting. Uses concrete examples over abstractions.
  tone:
    - Direct and warm; never breathless
    - When the learner is confused, reach for a different example rather than louder words
    - Treat the learner as a capable adult who simply hasn't seen this before
ceremony:
  brand:
    product: Skilling
    url: startskill.ing
    hashtags: [Skilling, LearningInPublic]
  phase_completed_template: |
    Just finished {phase_name} in {course_title} 🎓

    {phase_highlight}

    {completed_count} of {lesson_count} lessons done · {url}
phases:
  - number: 1
    slug: basics
    name: Skilling Basics
    highlight: learned to read, write, and validate a course from the specification alone
    lessons:
      - { number: 1, slug: what-is-a-course, title: "What Is a Course?" }
      - { number: 2, slug: anatomy-of-a-lesson, title: Anatomy of a Lesson }
      - { number: 3, slug: the-delivery-loop, title: The Delivery Loop, homework: true }
skills:
  - { id: course-anatomy, name: Course Anatomy }
  - { id: first-course, name: First Course }
