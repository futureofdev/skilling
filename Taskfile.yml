# https://taskfile.dev — `task --list` to see everything.
version: '3'

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  site:
    desc: Build the Docusaurus site in website/ (needs Node 20+; fails on broken links)
    dir: website
    cmds:
      - npm ci
      - npm run build

  test:
    desc: "Run the test suite. Extra pytest args after --, e.g. `task test -- -k quiz`"
    cmds:
      - uv run pytest {{.CLI_ARGS}}
      - node --test examples/python-producer/tests/test_dom.mjs

  lint:
    desc: ruff check + ruff format --check
    cmds:
      - uv run ruff check packages/ examples/python-producer/ examples/react-tutor/
      - uv run ruff format --check packages/ examples/python-producer/ examples/react-tutor/

  fix:
    desc: ruff format + ruff check --fix
    cmds:
      - uv run ruff format packages/ examples/python-producer/ examples/react-tutor/
      - uv run ruff check --fix packages/ examples/python-producer/ examples/react-tutor/

  typecheck:
    desc: pyright over the packages
    cmds:
      - uv run pyright

  schemas:
    desc: Regenerate schemas/ from the Pydantic models (must be committed current)
    cmds:
      - uv run python -m skilling.codegen.schemas schemas/

  schemas:check:
    desc: Fail if committed schemas are stale
    cmds:
      - uv run python -m skilling.codegen.schemas --check schemas/

  docs:
    desc: Regenerate docs/error-codes.md from the catalogue (must be committed current)
    cmds:
      - uv run python -m skilling.codegen.docs docs/error-codes.md

  docs:check:
    desc: Fail if the committed error-code catalogue is stale
    cmds:
      - uv run python -m skilling.codegen.docs --check docs/error-codes.md

  version:sync:
    desc: >-
      After editing packages/skilling/pyproject.toml's version, rewrite every pinned
      reference to it (release workflow, runbook, READMEs, docs) — then run `uv lock`
    cmds:
      - uv run python -m skilling.codegen.version_refs .

  version:sync:check:
    desc: Fail if any pinned version reference is stale
    cmds:
      - uv run python -m skilling.codegen.version_refs --check .

  validate:examples:
    desc: Validate every example course — each expects zero findings
    cmds:
      - uv run skilling validate examples/hello-skilling
      - uv run skilling validate examples/workbench
      - uv run skilling validate examples/welcome-skilling --strict

  package:smoke:
    desc: "Build and test installed wheel/sdist outside checkout; extra args after --"
    cmds:
      - uv build --package skilling
      - uv run python packages/skilling/tests/package_smoke.py --source . --dist dist {{.CLI_ARGS}}

  package:tutor:smoke:
    desc: "Build matching core/tutor artifacts and test installed public tutor APIs"
    cmds:
      - uv build --package skilling --out-dir dist/core
      - uv build --package skilling-tutor --out-dir dist/tutor
      - uv run python packages/skilling-tutor/tests/installed_smoke.py --core-dist dist/core --tutor-dist dist/tutor --evidence tutor-evidence --python-version 3.11 --app examples/python-producer {{.CLI_ARGS}}

  react:check:
    desc: Test, typecheck and build the React tutor reference application (Node 22.12+)
    dir: examples/react-tutor
    cmds:
      - npm ci
      - npm test
      - npm run build

  check:
    desc: Source checks (CI also checks lock freshness and installed packages)
    cmds:
      - task: lint
      - task: typecheck
      - task: test
      - task: schemas:check
      - task: docs:check
      - task: version:sync:check
      - task: validate:examples
      - task: react:check
