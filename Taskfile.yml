# https://taskfile.dev — `task --list` to see everything.
version: '3'

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  test:
    desc: "Run the test suite. Extra pytest args after --, e.g. `task test -- -k quiz`"
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  lint:
    desc: ruff check + ruff format --check
    cmds:
      - uv run ruff check packages/
      - uv run ruff format --check packages/

  fix:
    desc: ruff format + ruff check --fix
    cmds:
      - uv run ruff format packages/
      - uv run ruff check --fix packages/

  typecheck:
    desc: pyright over the packages
    cmds:
      - uv run pyright

  schemas:
    desc: Regenerate schemas/ from the Pydantic models (must be committed current)
    cmds:
      - uv run python -m skilling.codegen.schemas schemas/

  schemas:check:
    desc: Fail if committed schemas are stale
    cmds:
      - uv run python -m skilling.codegen.schemas --check schemas/

  docs:
    desc: Regenerate docs/error-codes.md from the catalogue (must be committed current)
    cmds:
      - uv run python -m skilling.codegen.docs docs/error-codes.md

  docs:check:
    desc: Fail if the committed error-code catalogue is stale
    cmds:
      - uv run python -m skilling.codegen.docs --check docs/error-codes.md

  validate:examples:
    desc: Validate every example course — each expects zero findings
    cmds:
      - uv run skilling validate examples/hello-skilling
      - uv run skilling validate examples/workbench

  package:smoke:
    desc: "Build and test installed wheel/sdist outside checkout; extra args after --"
    cmds:
      - uv build --package skilling
      - uv run python packages/skilling/tests/package_smoke.py --source . --dist dist {{.CLI_ARGS}}

  check:
    desc: Source checks (CI also checks lock freshness and installed packages)
    cmds:
      - task: lint
      - task: typecheck
      - task: test
      - task: schemas:check
      - task: docs:check
      - task: validate:examples
