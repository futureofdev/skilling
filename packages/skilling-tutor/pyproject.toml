[project]
name = "skilling-tutor"
version = "0.1.0"
description = "Optional native Pydantic AI tutor capability for Skilling producer applications."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "The Skilling maintainers" }]
classifiers = [
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["skilling>=0.8.0,<0.9.0", "pydantic-ai-slim>=2.52.0,<2.53.0", "pydantic-ai-harness[skills]>=0.52.0,<0.53.0"]

[project.optional-dependencies]
fastapi = ["fastapi>=0.142.2,<0.143"]

[project.urls]
Source = "https://github.com/futureofdev/skilling"
Documentation = "https://github.com/futureofdev/skilling/blob/main/docs/python-tutor.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skilling_tutor"]
