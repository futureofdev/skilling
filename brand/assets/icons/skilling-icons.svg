<?xml version="1.0" encoding="UTF-8"?>
<!--
  Skilling icon sprite — 20 glyphs.
  24x24 grid, 2px stroke, butt caps, mitred joins, zero radius.
  Inherited from the Future of Dev icon grammar unchanged.

  Usage:
    <svg width="24" height="24" style="color:#111827"><use href="skilling-icons.svg#sk-stage-build"/></svg>

  Seven glyphs are borrowed from the Future of Dev set without redrawing —
  marked BORROWED below. A child brand that redraws its parent's icons is
  telling you the two systems are not really related.

  Deliberately absent: no star, no medal (quality is editorial and must never be
  a shape a course can award itself) and no certificate (Skilling does not
  credential at launch, and an icon is a promise).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute">
<defs>

  <!-- ===== The four stages ===== -->
  <symbol id="sk-stage-understand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
    <title>Understand (BORROWED — FoD "Learn")</title>
    <path d="M2 5H11V20H2Z"/><path d="M13 5H22V20H13Z"/>
  </symbol>
  <symbol id="sk-stage-practise" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
    <title>Practise</title>
    <path d="M8 3H21V16"/><path d="M3 8H16V21H3Z"/>
  </symbol>
  <symbol id="sk-stage-build" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
    <title>Build (BORROWED — FoD "Build")</title>
    <rect x="3" y="15" width="18" height="6"/><rect x="3" y="8" width="11" height="6"/>
    <rect x="16" y="2" width="5" height="5" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="sk-stage-demonstrate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
    <title>Demonstrate</title>
    <rect x="3" y="3" width="18" height="12"/><path d="M12 15V19"/><path d="M6 19H18"/>
  </symbol>

  <!-- ===== Package &amp; provenance ===== -->
  <symbol id="sk-course-file" viewBox="0 0 24 24">
    <title>Course file — the mark itself, the only icon permitted to be the logo</title>
    <g fill="currentColor" transform="scale(0.75)">
      <path d="M0 4 H28 V12 H8 V16 H28 V32 H0 V24 H20 V20 H0 Z"/>
    </g>
  </symbol>
  <symbol id="sk-version" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
    <title>Version / edition</title>
    <path d="M3 5H21"/><path d="M3 12H21"/><path d="M3 19H21"/>
    <rect x="3" y="10.5" width="6" height="3" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="sk-licence" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
    <title>Licence / terms</title>
    <rect x="3" y="3" width="18" height="18"/><path d="M7 8H17"/><path d="M7 12H14"/>
    <rect x="7" y="15" width="5" height="3" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="sk-conformance" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
    <title>Conformance (BORROWED — FoD "Test"). Validator output only, never quality.</title>
    <rect x="3" y="3" width="18" height="18"/><path d="M7.5 12L11 15.5L16.5 8.5"/>
  </symbol>
  <symbol id="sk-conformance-fail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
    <title>Conformance findings</title>
    <rect x="3" y="3" width="18" height="18"/><path d="M8 8L16 16"/><path d="M16 8L8 16"/>
  </symbol>
  <symbol id="sk-provenance" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
    <title>Provenance / author</title>
    <path d="M3 21V16H21V21"/><rect x="9" y="4" width="6" height="6" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="sk-runtime" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
    <title>Runtime compatibility — always paired with a tested date</title>
    <rect x="2" y="7" width="8" height="10"/><rect x="14" y="7" width="8" height="10"/><path d="M10 12H14"/>
  </symbol>

  <!-- ===== Access — always word-led, glyph second ===== -->
  <symbol id="sk-access-free" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
    <title>Free / open</title>
    <path d="M4 10H20V21H4Z"/><path d="M8 10V6H15V8"/>
  </symbol>
  <symbol id="sk-access-premium" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
    <title>Premium · buy once</title>
    <rect x="3" y="3" width="14" height="14"/>
    <rect x="10" y="10" width="11" height="11" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="sk-access-private" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
    <title>Private</title>
    <path d="M4 10H20V21H4Z"/><path d="M8 10V6H16V10"/>
  </symbol>

  <!-- ===== The learner journey ===== -->
  <symbol id="sk-journey-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
    <title>Download</title>
    <path d="M12 3V15"/><path d="M7 10L12 15L17 10"/><path d="M4 20H20"/>
  </symbol>
  <symbol id="sk-journey-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
    <title>Open (BORROWED — FoD "Enter")</title>
    <path d="M13 3H21V21H13"/><path d="M3 12H15"/><path d="M11 8L15 12L11 16"/>
  </symbol>
  <symbol id="sk-journey-keep" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
    <title>Keep (BORROWED — FoD "Keep")</title>
    <path d="M6 3H18V21L12 16L6 21Z"/>
  </symbol>

  <!-- ===== Stage state — never colour alone ===== -->
  <symbol id="sk-state-done" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
    <title>Done</title>
    <rect x="4" y="4" width="16" height="16" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="sk-state-current" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
    <title>In progress</title>
    <path d="M6 4L16 12L6 20"/>
  </symbol>
  <symbol id="sk-state-todo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
    <title>Not started</title>
    <rect x="4" y="4" width="16" height="16" stroke-dasharray="3 3"/>
  </symbol>

</defs>
</svg>
