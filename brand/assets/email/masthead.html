<!-- Skilling email masthead. Beehiiv-safe.

     The mark ships as a flat PNG on a Build-lime field because Gmail and Outlook invert
     colours without asking, and an inverted Cut reads as a mirrored S in a subscriber's
     inbox. Clients do not invert images, so a PNG on lime is the only version that
     survives dark mode intact.

     Never inline SVG here. Never a transparent PNG — transparency is what lets the client
     decide your figure and ground for you.

     Always keep the alt text, so a stripped image still says the name. -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td align="left" style="padding:20px 24px;">
      <img src="https://YOUR-HOST/masthead-lime-2x.png"
           alt="Skilling"
           width="280" height="44"
           style="display:block;border:0;outline:none;text-decoration:none;height:auto;max-width:280px;">
    </td>
  </tr>
</table>
